server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://192.168.0.75:3306/eerp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: test123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 192.168.0.79
    port: 6379
    password: foobared
    database: 15
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: eerp-secret-key-2026-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24小时
  header: Authorization
  prefix: Bearer

logging:
  level:
    com.eerp: debug
    org.springframework.security: debug

eerp:
  storage:
    type: local  # local/oss/minio
    local:
      base-path: ./data/attachments
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket-name: eerp-attachments
  wf:
    callback-token: ${WF_CALLBACK_TOKEN:eerp-wf-default-token}
    push-timeout-ms: 10000
